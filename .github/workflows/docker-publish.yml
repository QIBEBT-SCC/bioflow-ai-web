name: Publish Docker Image

on:
    release:
        types: [published]

env:
    REGISTRY: ghcr.io

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        # 配置 GITHUB_TOKEN 的权限，以便推送镜像到 GitHub Packages
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # Docker 镜像名称必须全小写，而 GitHub Repository 可能包含大写字母（如 QIBEBT-SCC）
            - name: Prepare Image Name
              run: |
                  IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                  echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 登录到 GHCR
            # 这里使用 GitHub Actions 自动提供的 GITHUB_TOKEN，不需要手动配置 PAT
            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 自动提取有关 Docker 镜像的 tags 和 labels
            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      # 如果不是预发布版则打上 latest 标签
                      type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

            # 构建并推送镜像
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # 使用 GitHub Actions 缓存层加速二次构建
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
