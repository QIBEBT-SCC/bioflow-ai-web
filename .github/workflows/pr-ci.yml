name: Frontend PR CI

on:
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: frontend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome check --changed --since="$PR_BASE_SHA" --no-errors-on-unmatched --reporter=github
      - name: React Doctor
        run: pnpm exec react-doctor --diff "$PR_BASE_SHA" --no-score --yes --annotations
      - name: Production build
        run: pnpm build
